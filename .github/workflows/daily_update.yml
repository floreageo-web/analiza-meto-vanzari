name: Actualizare Zilnica Meteo

on:
  schedule:
    - cron: '0 1 * * *'  # 01:00 UTC = 03:00 ora României (iarna UTC+2)
  workflow_dispatch:       # Permite pornirea manuală din tab-ul Actions

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout cod
        uses: actions/checkout@v3
        with:
          # ✅ FIX: token explicit ca să poată face push înapoi
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setare Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: Instalare dependinte
        run: |
          pip install pandas requests streamlit plotly

      - name: Executie script extragere
        run: python app.py --update_only

      - name: Salvare date noi in GitHub
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add baza_date.csv
          # Dacă nu sunt modificări, exit 0 = succes (nu eșuează workflow-ul)
          git diff --staged --quiet && echo "✅ Nicio modificare de salvat." || (
            git commit -m "Actualizare automata date meteo [skip ci]" &&
            git push
          )
